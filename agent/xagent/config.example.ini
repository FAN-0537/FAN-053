[llm]
api_key = sk-xxxxxxxxxxxxxxxx
base_url = https://api.deepseek.com/v1
model = deepseek-chat
temperature = 0.7
# 可选：模型上下文窗口大小（Token）。不填时默认 131072 并显示“默认”。
# context_window = 131072

[agent]
max_tool_rounds = 8
agents_md_file = AGENTS.md

[context]
default_window = 131072
warning_ratio = 0.6
compact_target_tokens = 5000
recall_max_matches = 8
recall_max_chars = 6000
snippet_radius = 160
archive_dir = .agents/context

[sessions]
dir = .agents/sessions

[tools]
max_text_file_bytes = 10485760
read_max_chars = 10000
cli_timeout = 30
cli_timeout_max = 300
cli_output_max_chars = 8000
web_timeout = 20
web_max_chars = 8000
web_max_bytes = 2097152
# 搜索服务 API（默认 Tavily）。也可用环境变量 XAGENT_SEARCH_API_KEY 覆盖密钥。
search_api_url = https://api.tavily.com/search
search_api_key =
search_max_results = 5

[mcp]
connect_timeout = 30
call_timeout = 120
close_timeout = 10

[ui]
message_max_chars = 6000

[skills]
max_name_length = 64
max_description_length = 1024
